<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodePapu | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

    <div class="auth-container">
        <div class="auth-box">
            <h1 class="logo">Code<span>Papu</span></h1>
            <p class="subtitle">Plataforma de Capacitación y Cumplimiento</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="admin@codepapu.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <p id="errorMessage" class="error-msg"></p>
            </form>
        </div>
    </div>

       <!-- ... resto de tu HTML ... -->
    
    <script>
        
        const loginForm = document.getElementById('loginForm');

        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault(); // Esto evita que la página se recargue
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMessage');

                errorMsg.textContent = 'Verificando...';

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (data.success) {
                        localStorage.setItem('usuarioCodePapu', JSON.stringify(data.usuario));
                        
                        if (data.usuario.rol === 'admin') {
                            window.location.href = 'matriz.html'; 
                        } else {
                            window.location.href = 'mis-cursos.html'; 
                        }
                    } else {
                        errorMsg.textContent = data.message;
                    }
                } catch (err) {
                    errorMsg.textContent = 'Error de conexión con el servidor.';
                }
            });
        }
    </script>
</body>
</html>
</body>
</html>
